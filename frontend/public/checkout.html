<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout — Couple Collection</title>
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('auth-pending');</script>
</head>
<body>
  <div class="site-utility">
    <span>Thoughtful finds for the moments you share</span>
    <span>South African store <span aria-hidden="true">·</span> Prices in ZAR</span>
  </div>
  <header class="site-header">
    <div class="brand">
      <a href="index.html" aria-label="Couple Collection home"><span class="logo-mark">CC</span><span class="brand-name">Couple Collection</span></a>
    </div>
    <form class="search-bar" action="shop.html">
      <label class="sr-only" for="search-input">Search products</label>
      <input id="search-input" type="search" name="q" placeholder="Search gifts, date-night finds and more">
      <button type="submit" aria-label="Search">⌕</button>
    </form>
    <nav class="site-nav">
      <a href="shop.html">Browse</a>
      <a href="cart.html" class="nav-cart">Basket <span data-cart-count>0</span></a>
    </nav>
  </header>
  <nav class="category-nav" aria-label="Shop categories">
    <a href="shop.html">All finds</a>
    <a href="shop.html?q=date">Date night</a>
    <a href="shop.html?q=wellness">Wellness</a>
    <a href="shop.html?q=gift">Gifts</a>
    <a href="shop.html?q=home">Home favourites</a>
  </nav>

  <main class="page-shell">
    <section class="page-heading">
      <h3>Checkout</h3>
      <p>Fill in your details and place your order with secure payment options.</p>
    </section>
    <div id="cart-summary"></div>
    <div id="checkout-total" class="cart-total"></div>
    <form id="checkout" class="checkout-form">
      <div class="field-row">
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
      </div>
      <div class="checkout-section-title">Delivery address</div>
      <label>Street address <input name="address" autocomplete="street-address" required></label>
      <div class="field-row">
        <label>City <input name="city" autocomplete="address-level2" required></label>
        <label>Postal code <input name="postal_code" autocomplete="postal-code" required></label>
      </div>
      <label>Delivery notes <textarea name="delivery_notes" rows="3" placeholder="Apartment, gate code, or delivery instructions"></textarea></label>
      <label>Payment method
        <select name="method" id="payment-method">
          <option value="card">Credit/Debit Card</option>
          <option value="eft">EFT (manual payment confirmation)</option>
        </select>
      </label>
      <div id="card-section" class="card-section" style="display:none;">
        <label>Card details</label>
        <div id="card-element" class="card-element"></div>
        <div id="card-errors" class="message" role="alert"></div>
      </div>
      <button class="button primary" type="submit">Place Order</button>
    </form>
    <div id="msg" class="message"></div>
  </main>
  <script src="auth.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const API_BASE = '/backend/php/api';
    let DELIVERY_FEE = 99.99;
    let storeConfig = null;

    function formatPrice(value){
      return `R${Number(value || 0).toFixed(2)}`;
    }

    function escapeHtml(value){
      const element = document.createElement('span');
      element.textContent = String(value || '');
      return element.innerHTML;
    }

    function updateCheckoutCartCount(cart){
      const count = cart.reduce((total, item) => total + Math.max(0, Number(item.qty) || 0), 0);
      document.querySelectorAll('[data-cart-count]').forEach(element => {
        element.textContent = String(count);
        element.setAttribute('aria-label', `${count} items in basket`);
      });
    }

    function renderSummary(cart){
      const container = document.getElementById('cart-summary');
      const submitButton = document.querySelector('#checkout button[type="submit"]');
      const unavailable = cart.some(item => item.unavailable);
      if(submitButton) submitButton.disabled = unavailable || !storeConfig;
      if(unavailable){
        document.getElementById('msg').textContent = 'Some cart items are no longer available. Return to the shop and refresh your cart.';
      }else if(!storeConfig){
        document.getElementById('msg').textContent = 'Checkout settings could not be loaded. Please try again later.';
      }else{
        document.getElementById('msg').textContent = '';
      }
      if(!cart.length){
        container.innerHTML = '<p>Your cart is empty. Add products from the shop first.</p>';
        document.getElementById('checkout-total').textContent = '';
        return;
      }
      let total = 0;
      container.innerHTML = cart.map(item => {
        if(item.unavailable){
          return `<div class="cart-row"><div>${escapeHtml(item.name)}</div><div class="message">Unavailable — remove this item from your cart.</div></div>`;
        }
        const itemTotal = (item.price||0) * (item.qty||1);
        total += itemTotal;
        return `<div class="cart-row"><div>${escapeHtml(item.name)}</div><div>${item.qty} x ${formatPrice(item.price||0)}</div><div>${formatPrice(itemTotal)}</div></div>`;
      }).join('') + `
        <div class="order-totals">
          <div><span>Products subtotal</span><strong>${formatPrice(total)}</strong></div>
          <div><span>Delivery fee</span><strong>${formatPrice(DELIVERY_FEE)}</strong></div>
        </div>`;
      document.getElementById('checkout-total').textContent = `Total including delivery: ${formatPrice(total + DELIVERY_FEE)}`;
    }

    async function loadStoreConfig(){
      try{
        const response = await fetch(`${API_BASE}/payment/stripe_config.php`);
        const cfg = await response.json();
        const deliveryFee = Number(cfg.deliveryFee);
        if(!response.ok || !Number.isFinite(deliveryFee) || deliveryFee < 0) throw new Error('Invalid store settings');
        DELIVERY_FEE = deliveryFee;
        storeConfig = cfg;
        return cfg;
      }catch(e){
        return null;
      }
    }

    async function initStripe(){
      const cfg = storeConfig || await loadStoreConfig();
      if(!cfg || !cfg.cardEnabled || !cfg.publishableKey || cfg.publishableKey === 'pk_test_replace_me') return null;
      return Stripe(cfg.publishableKey);
    }

    async function loadCart(){
      let cart = [];
      try{
        const res = await fetch(`${API_BASE}/cart.php`);
        if(res.ok){ cart = await res.json(); }
      }catch(e){ }
      if(!Array.isArray(cart) || !cart.length){
        try{
          cart = JSON.parse(localStorage.getItem('cart') || '[]');
        }catch(e){
          cart = [];
        }
      }
      cart = (Array.isArray(cart) ? cart : []).map(item => ({
        id: item.product_id || item.id,
        name: item.name,
        price: Number(item.price || 0),
        qty: Number(item.qty || 1)
      })).filter(item => item.id && item.name && item.qty > 0);
      let catalog = [];
      try{
        const response = await fetch(`${API_BASE}/products.php`);
        if(!response.ok) throw new Error('Product catalog request failed');
        catalog = await response.json();
        if(!Array.isArray(catalog)) throw new Error('Product catalog response was invalid');
      }catch(error){
        cart = cart.map(item => ({...item, unavailable: true}));
      }
      cart = cart.map(item => {
        const product = catalog.find(entry => String(entry.id) === String(item.id));
        return product
          ? {...item, id: product.id, name: product.name, price: Number(product.price), unavailable: false}
          : {...item, unavailable: true};
      });
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCheckoutCartCount(cart);
      renderSummary(cart);
      return cart;
    }

    document.addEventListener('DOMContentLoaded', async ()=>{
      if(window.customerAuthReady && !await window.customerAuthReady) return;
      await loadStoreConfig();
      const cart = await loadCart();
      const paymentMethod = document.getElementById('payment-method');
      const cardSection = document.getElementById('card-section');
      const cardErrors = document.getElementById('card-errors');
      let stripe = null;
      let cardElement = null;
      let confirmedPaymentIntentId = null;

      async function mountCard(){
        if(cardElement) return;
        stripe = await initStripe();
        if(!stripe){
          cardSection.style.display = 'none';
          paymentMethod.value = 'eft';
          document.getElementById('msg').textContent = 'Card payments are not configured yet. EFT orders remain pending until the store confirms payment.';
          return;
        }
        const elements = stripe.elements();
        cardElement = elements.create('card');
        cardElement.mount('#card-element');
      }

      function updatePaymentUI(){
        if(paymentMethod.value === 'card'){
          cardSection.style.display = 'block';
          mountCard();
        } else {
          cardSection.style.display = 'none';
          cardErrors.textContent = '';
        }
      }

      paymentMethod.addEventListener('change', updatePaymentUI);
      updatePaymentUI();

      document.getElementById('checkout').addEventListener('submit', async function(e){
        e.preventDefault();
        const fd = new FormData(e.target);
        if(!cart.length){ document.getElementById('msg').textContent = 'Your cart is empty.'; return; }
        const submitButton = e.target.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Processing…';
        document.getElementById('msg').textContent = '';
        const shippingAddress = [
          fd.get('address'),
          fd.get('city'),
          fd.get('postal_code'),
          fd.get('delivery_notes') ? `Notes: ${fd.get('delivery_notes')}` : ''
        ].filter(Boolean).join(', ');
        const method = confirmedPaymentIntentId ? 'card' : fd.get('method');

        if(method === 'card'){
          if(!confirmedPaymentIntentId && !cardElement){
            document.getElementById('msg').textContent = 'Card input is not ready.';
            submitButton.disabled = false;
            submitButton.textContent = 'Place Order';
            return;
          }
          cardErrors.textContent = '';
          if(!confirmedPaymentIntentId){
            let pi = null;
            try{
              const intentRes = await fetch(`${API_BASE}/payment/create_intent.php`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({cart: cart.map(item => ({id:item.id, qty:item.qty}))})
              });
              pi = await intentRes.json();
              if(!intentRes.ok){
                document.getElementById('msg').textContent = pi.error || 'Payment initiation failed.';
                submitButton.disabled = false;
                submitButton.textContent = 'Place Order';
                return;
              }
            }catch(error){
              document.getElementById('msg').textContent = 'Payment service is not available right now. Your cart is still saved; please try EFT or try again later.';
              submitButton.disabled = false;
              submitButton.textContent = 'Place Order';
              return;
            }
            if(!pi.client_secret){
              document.getElementById('msg').textContent = pi.error || 'Payment initiation failed.';
              submitButton.disabled = false;
              submitButton.textContent = 'Place Order';
              return;
            }
            let result;
            try{
              result = await stripe.confirmCardPayment(pi.client_secret, {
                payment_method: {
                  card: cardElement,
                  billing_details: {name: fd.get('name'), email: fd.get('email')}
                }
              });
            }catch(error){
              cardErrors.textContent = 'Card confirmation could not be completed. Please retry.';
              submitButton.disabled = false;
              submitButton.textContent = 'Place Order';
              return;
            }
            if(result.error){
              cardErrors.textContent = result.error.message || 'Payment failed';
              submitButton.disabled = false;
              submitButton.textContent = 'Place Order';
              return;
            }
            if(!result.paymentIntent || result.paymentIntent.status !== 'succeeded'){
              document.getElementById('msg').textContent = 'Payment is not complete. Please try again.';
              submitButton.disabled = false;
              submitButton.textContent = 'Place Order';
              return;
            }
            confirmedPaymentIntentId = result.paymentIntent.id;
            paymentMethod.value = 'card';
            paymentMethod.disabled = true;
          }
          try{
            const orderRes = await fetch(`${API_BASE}/checkout.php`, {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({
                name: fd.get('name'),
                email: fd.get('email'),
                method: 'card',
                payment_intent_id: confirmedPaymentIntentId,
                cart: cart.map(item => ({id:item.id, qty:item.qty})),
                shipping_address: shippingAddress
              })
            });
            const orderData = await orderRes.json();
            if(orderRes.ok){
              localStorage.removeItem('cart');
              window.location.href = `order_success.html?order_id=${encodeURIComponent(orderData.order_id)}&status=${encodeURIComponent(orderData.status)}`;
              return;
            }
            document.getElementById('msg').textContent = `Your payment is confirmed, but the order could not be saved: ${orderData.error || 'please try again'}. Keep payment reference ${confirmedPaymentIntentId} and contact the store before retrying.`;
          }catch(error){
            document.getElementById('msg').textContent = `Your payment is confirmed, but the order could not be saved. Keep payment reference ${confirmedPaymentIntentId} and contact the store before retrying.`;
          }
          submitButton.disabled = false;
          submitButton.textContent = 'Place Order';
          return;
        }

        const payload = {
          name: fd.get('name'),
          email: fd.get('email'),
          method: method,
          cart: cart.map(item => ({id:item.id, qty:item.qty})),
          shipping_address: shippingAddress
        };
        try{
          const res = await fetch(`${API_BASE}/checkout.php`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
          const j = await res.json();
          if(res.ok){
            localStorage.removeItem('cart');
            window.location.href = `order_success.html?order_id=${encodeURIComponent(j.order_id)}&status=${encodeURIComponent(j.status)}`;
          } else {
            document.getElementById('msg').textContent = j.error || 'Failed to place order.';
            submitButton.disabled = false;
            submitButton.textContent = 'Place Order';
          }
        }catch(error){
          document.getElementById('msg').textContent = 'We could not confirm your order. Your cart is still saved; please try again in a moment.';
          submitButton.disabled = false;
          submitButton.textContent = 'Place Order';
        }
      });
    });
  </script>
</body>
</html>
